plugins {
	id 'java'
    id 'checkstyle'
    id 'jacoco'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
    id "org.liquibase.gradle" version "2.2.2" apply false
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'
def jdkVersion = "25"

defaultTasks "bootRun"

jar {
    enabled = false
}

bootJar {
    archiveFileName = String.format("%s-%s.jar", rootProject.name, version)
}

assert System.properties["java.specification.version"] == jdkVersion
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(jdkVersion)
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = "2.8.11"
    h2Version = "2.4.240"
    //liquibaseVersion = "4.33.0"
        postgresVersion = "42.7.8"

    mockitoVersion = "5.19.0"

}

configurations {
     mockitoAgent
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = true   // предупреждения не ломают сборку
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}



jacoco {
    toolVersion = '0.8.14'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.postgresql:postgresql:${postgresVersion}"
    runtimeOnly "com.h2database:h2:${h2Version}"
    //runtimeOnly "org.liquibase:liquibase-core:${liquibaseVersion}"

    developmentOnly "org.springframework.boot:spring-boot-devtools"

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.google.firebase:firebase-admin:9.3.0'

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    mockitoAgent("org.mockito:mockito-core:${mockitoVersion}") {
        transitive = false
    }

    implementation 'com.github.librepdf:openpdf:1.3.39'

    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    implementation 'org.springframework.boot:spring-boot-starter-aop'
}

tasks.withType(Test).configureEach {
    jvmArgs += "-Xshare:off"
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// Unit-тесты. ignoreFailures убран: упавший тест должен ломать сборку
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Интеграционные тесты: только с тегом "integration"
tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs integration tests'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    failOnNoDiscoveredTests = false   // Gradle 9: не падать, если тестов с тегом ещё нет
    shouldRunAfter tasks.named('test')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test'), tasks.named('integrationTest')

    // Берём .exec-файлы, которые JaCoCo создаёт для каждой Test-задачи
    executionData.setFrom(
        fileTree(layout.buildDirectory).include('jacoco/*.exec')
    )

    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    finalizedBy tasks.named('jacocoTestReport')
}