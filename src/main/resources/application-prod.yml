spring:
    application:
        name: cinema_backend
    main:
        banner-mode: "off"
    datasource:
        url: jdbc:h2:file:./data
        username: sa
        password: sa
        driver-class-name: org.h2.Driver
    jpa:
        properties:
            hibernate:
                jdbc:
                    lock_timeout: 5000
                dialect: org.hibernate.dialect.H2Dialect
                format_sql: false
        hibernate:
            ddl-auto: update
    h2:
        console:
            enabled: true
            path: /h2-console
logging:
    level:
        ru:
            ulstu:
                is:
                    server: DEBUG
        org:
            h2: DEBUG
server:
    address: 0.0.0.0

firebase:
    enabled: true
