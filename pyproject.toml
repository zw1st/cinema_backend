[project]
name = "ocr"
version = "0.1.0"
description = "ocr research for reading meters data"
authors = [
    {name = "alex",email = "saneknastile@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "notebook (>=7.6.0,<8.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "easyocr (>=1.7.2,<2.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
    "paddleocr (==3.3.3)",
    "paddlepaddle (==3.2.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
