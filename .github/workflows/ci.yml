name: CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Record start time
              run: echo "PIPELINE_START=$(date +%s)" >> "$GITHUB_ENV"

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - uses: gradle/actions/setup-gradle@v4

            # Сборка и тесты. Падает только при ошибках компиляции или тестов
            - name: Build and test
              run: ./gradlew build -x checkstyleMain -x checkstyleTest

            # Линтер отдельно: даже сломанный конфиг не уронит пайплайн
            - name: Lint (Checkstyle)
              if: always()
              continue-on-error: true
              run: ./gradlew checkstyleMain

            - name: Collect metrics
              if: always()
              run: |
                  python -m pip install --quiet lizard
                  mkdir -p build/metrics
                  python scripts/collect_metrics.py | tee build/metrics/metrics.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: reports
                  if-no-files-found: warn
                  path: |
                      build/reports/
                      build/test-results/
                      build/metrics/
